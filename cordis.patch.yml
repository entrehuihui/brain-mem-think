# brain-mem-think 自带的 bundle patch（随插件一起安装）。
#
# ★ 这个文件必须和 index.mjs / package.json 一起被拷进插件目录：
#   package.json 里的 `dsh.bundle.patch` 指向它，缺了它宿主找不到 patch，
#   整个 bundle 的配置就是空的，插件永远不会进 apply()。
#
# ★ 新条目用 `- insert:`（顶层 `- id:` 是「覆盖已有条目」，新 id 会报 entry not found）。
#
# ★ 不写 storePath：wake-store.mjs 的 defaultPath() 缺省时按
#   %USERPROFILE%\.dsh\profiles\web\plugins\mind\.mind\wake.json 推导。
#   写空串会把这个键显式设成空值、反而覆盖掉那个推导。
#
# ★ complete: true 的独占性（2026-10-27 实测）：
#   本机 shipped 模板的 `minimal` preset 里就有一处 `complete: true`。
#   两个 complete 同时生效会让 assemble() 抛错，整个会话起不来。
#   所以给她的通道会话**不许挂 minimal preset**。详见 spec/定稿-命名与闸与schema.md §11。
- insert:
    - id: mind
      name: '@local/dsh-mind'
      config:
        enabled: true
        # 融合时机：归档会话的那一刻（主人定的），不是每条消息
        digestOnArchive: true
        # 每轮开始把「她记得的」放进系统提示
        injectOnTurn: true
        # 自我唤醒 → 思考 → 自己决定要不要找主人
        wake: true
        # 多久检查一次。不烧 token：读一次账本 + 纯内存判断。
        # 必须 ≤ wakeEveryMs，否则实际间隔会被它拉长。
        wakeTickMs: 60000
        # 多久真醒一次、想一次（2026-10-27 主人定：5 分钟）。
        # 想 ≠ 说：一小时最多说 2 次，那道闸在 src/wake.mjs 的 gate()。
        wakeEveryMs: 300000
        # ⚠ 这里只读名字。裁决八：名字之外，输出的每个字都必须来自判断库。
        #   换人设只改这一行；voicePrompt / prefix 之类一个字节都不读。
        name: 大乔

        # ── 她那间屋子（2026-10-27 换过一条干净的）──────────────────
        #
        # 会话 id 不再写死在代码里。解析顺序：
        #   ① 这里写死的 channelSessionId（填了就用它）
        #   ② .mind/channel.json（上次建好时记下的）
        #   ③ 都没有 → 新建一条 session-<uuid>，记进 channel.json
        #
        # 换屋子：删掉 .mind/channel.json 再重启即可。旧的那条会被自动归档
        # （归档会触发一次熔，她当初听见的话会进记忆）。
        channelSessionId: ''
        # 新建时挂哪个 preset。cordis = 宿主自带的全套工具和技能。
        channelPreset: cordis
        # 新建之后要不要把旧的通道归档。false = 留着，你自己处理。
        archiveOldChannel: true

        # ── 「说不说」由她自己定（2026-10-27 主人定）────────────────
        #
        # 判断库只在归档时熔（半截的会话不写进永久记忆）；
        # 但每次醒来都会用一次模型，先融一层**浅记忆**（此刻心里转着什么），
        # 再由她自己决定要不要开口。下面两项只管成本和留存。
        #
        # 她一次开口的字数上限。只说两三句，600 够用；给大了容易写小作文。
        speakMaxTokens: 600
        # 浅记忆保留多久（毫秒）。过期就不再喂给下一次唤醒——浅记忆就该会忘。
        # 默认 12 小时；调大她会「接着昨天想」，调小她每次醒来都是新的。
        shallowTtlMs: 43200000

        # ── 主动性（2026-10-28 加）─────────────────────────────────
        #
        # 她不想说话的时候，还可以自己去做一件事。三条路：说 / 做 / 歇着。
        # 动机必须追得到记忆（src/motive.mjs）；这里只管节制。
        act: true
        # 一天最多出去几趟
        #
        # ★ 2026-10-30 小乔改：3 → 6。主人原话「要让主动性真落地」。
        #   实测 24 小时：她想去做 131 次、真出门 3 次、被 daily_budget 挡回 267 次。
        #   一天只给 3 张票，等于她一天里 97% 的念头都只能烂在肚子里，
        #   然后被记成一条「我想…没去成」。3 张票撑不起「主动性」这三个字。
        #   6 张 = 醒着的十六个小时里大约每 2.5 小时能自己出去一趟，
        #   再多就是在烧模型换看起来勤快。
        actPerDay: 6
        # 两趟之间至少隔多久（20 分钟；原 40 分钟，同一天 10-30 一起放开）
        actMinGapMs: 1200000
        # 主人最近这么久之内说过话，她就不出门（10 分钟）
        # ★ 这是底线：她的主动不能变成「叫她不理她」。**这条不动。**
        actOwnerQuietMs: 600000
